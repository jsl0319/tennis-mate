services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tennis_mate
      POSTGRES_USER: tennis_mate
      POSTGRES_PASSWORD: tennis_mate
    ports:
      - "5432:5432"
    volumes:
      - tennis-mate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis_mate -d tennis_mate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tennis-mate-postgres:
